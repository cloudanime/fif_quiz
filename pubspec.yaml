name: church_quiz
description: "A new Flutter project for a church quiz application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.0
  
  # Utilities
  uuid: ^4.3.3
  path_provider: ^2.1.2
  
  # Networking
  http: ^0.13.3
  
  # Media
  image_picker: ^0.8.4+8
  file_picker: ^8.1.7
  image_picker_for_web: ^2.1.7
  video_player: ^2.8.1
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  
  # Charts & Animations
  fl_chart: ^0.70.0
  confetti: ^0.8.0
  
  # URL & Backend
  url_launcher: ^6.1.11
  supabase_flutter: ^2.12.4

  sembast: ^3.7.5
  sembast_web: ^2.4.0
  csv: ^6.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  intl: ^0.18.0  # Moved from dependencies to dev_dependencies

flutter_icons:
  android: true
  ios: true
  image_path: "assets/baba100new.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/medal.png
    - assets/medal_2.png
    - assets/questions.csv

plugins:
  file_picker:
    platforms:
      linux: "file_picker:linux"
      macos: "file_picker:macos"
      windows: "file_picker:windows"